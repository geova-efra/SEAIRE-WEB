<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEAIRE | Administración de proyectos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#07111f;color:#f5f8fc}
input,textarea,select,button{font:inherit}
.top{height:70px;border-bottom:1px solid #183650;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:#07111f;position:sticky;top:0;z-index:5}
.brand{font-size:24px;font-weight:900;letter-spacing:2px}.brand span{color:#18b6ff}.top a{color:#b9cad9;text-decoration:none}
.wrap{width:min(1150px,94%);margin:28px auto}.panel{background:#0b1d30;border:1px solid #183650;border-radius:18px;padding:25px}
.login{max-width:430px;margin:70px auto}.hidden{display:none}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.primary{background:#18b6ff;color:#061522;border:0;padding:11px 16px;border-radius:9px;font-weight:900;cursor:pointer}
.secondary,.danger{background:#102940;color:#fff;border:1px solid #24445d;padding:9px 12px;border-radius:8px;cursor:pointer}
.danger{color:#ffb0b0}.form{display:grid;gap:13px;margin-top:20px}.form label{font-size:13px;color:#b1c1d0}
.form input,.form select,.form textarea{width:100%;margin-top:6px;background:#061522;color:#fff;border:1px solid #24445d;border-radius:8px;padding:11px}
.form textarea{min-height:120px;resize:vertical}.list{display:grid;gap:12px;margin-top:20px}
.item{display:grid;grid-template-columns:100px 1fr auto;gap:14px;align-items:center;padding:14px;background:#0d2237;border:1px solid #1b3a53;border-radius:13px}
.thumb{height:78px;background:#11304a;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:28px}.thumb img{width:100%;height:100%;object-fit:cover}
.item small{color:#90a8bb}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{display:inline-block;margin-top:5px;font-size:11px;padding:4px 7px;border-radius:99px;background:#17364d;color:#7ddcff}
.preview{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.preview-item{position:relative;width:120px}
.preview-item img{width:120px;height:82px;object-fit:cover;border-radius:8px;border:1px solid #24445d}.remove{position:absolute;right:3px;top:3px;border:0;background:#061522dd;color:#fff;border-radius:50%;width:23px;height:23px;cursor:pointer}
.video-preview{margin-top:10px;color:#8fb1c7;font-size:13px}.msg{margin:10px 0;color:#ffb3b3;white-space:pre-wrap}.ok{color:#7ff0c2}
.help{padding:12px;background:#0e2539;border-radius:8px;color:#9fb3c5;font-size:12px;line-height:1.5}
.check{display:flex!important;align-items:center;gap:8px}.check input{width:auto!important;margin:0!important}
@media(max-width:760px){.item{grid-template-columns:70px 1fr}.actions{grid-column:1/-1}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SEA<span>IRE</span> · ADMIN</div>
  <div>
    <a href="index.html">Ver página pública</a>
    <button class="secondary" id="logout">Salir</button>
  </div>
</header>

<div class="wrap">
  <div id="login" class="panel login hidden">
    <h2>Acceso administrativo</h2>
    <p style="color:#aebfd0">Solo el usuario autorizado puede publicar proyectos.</p>
    <form id="loginForm" class="form">
      <label>Correo<input id="email" type="email" required></label>
      <label>Contraseña<input id="password" type="password" required></label>
      <button class="primary">Ingresar</button>
    </form>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="app" class="panel hidden">
    <div class="head">
      <div><div style="color:#18b6ff;font-size:12px;font-weight:900;letter-spacing:2px">ADMINISTRACIÓN</div><h1>Proyectos realizados</h1></div>
      <button class="primary" onclick="newProject()">+ Agregar proyecto</button>
    </div>
    <div id="msg" class="msg"></div>
    <div id="list" class="list"></div>

    <div id="editor" class="hidden">
      <hr style="border-color:#183650;margin:25px 0">
      <h2 id="formTitle">Nuevo proyecto</h2>
      <form id="form" class="form">
        <input type="hidden" id="pid">

        <label>Nombre del proyecto
          <input id="title" required placeholder="Ej. Instalación de transformador trifásico 500 kVA">
        </label>

        <label>Servicio
          <select id="service">
            <option>Ingeniería eléctrica</option>
            <option>Automatización industrial</option>
            <option>Mantenimiento</option>
            <option>Energía solar</option>
            <option>Transformadores</option>
            <option>Asesoría técnica</option>
          </select>
        </label>

        <label>Ubicación<input id="location" placeholder="Ej. La Joya de los Sachas, Orellana"></label>
        <label>Año<input id="year" type="number" value="2026"></label>
        <label>Descripción<textarea id="description" placeholder="Alcance, trabajos ejecutados, equipos, resultados, etc."></textarea></label>

        <label>Fotografías del proyecto
          <input id="photoFiles" type="file" accept="image/*" multiple>
          <div class="help">Selecciona una o varias fotografías. Se subirán a Supabase y quedarán disponibles públicamente.</div>
          <div id="preview" class="preview"></div>
        </label>

        <label>Video del proyecto (opcional)
          <input id="videoFile" type="file" accept="video/*">
          <div id="videoPreview" class="video-preview"></div>
        </label>

        <label class="check"><input id="published" type="checkbox" checked> Publicar para todos los visitantes</label>

        <div>
          <button class="primary" type="submit" id="saveBtn">Guardar y publicar</button>
          <button type="button" class="secondary" onclick="cancel()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
let client=null, currentImages=[], currentVideo=null;

const $ = id => document.getElementById(id);
function waitForClient(){
  return new Promise(resolve=>{
    const t=setInterval(()=>{
      if(window.seaireSupabase){clearInterval(t);resolve(window.seaireSupabase)}
    },50);
  });
}
function showMessage(text,ok=false){$("msg").textContent=text;$("msg").className="msg "+(ok?"ok":"")}
function safe(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function init(){
  client=await waitForClient();
  const {data}=await client.auth.getSession();
  if(data.session) showApp(); else $("login").classList.remove("hidden");
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); $("loginMsg").textContent="";
  const {error}=await client.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  if(error)$("loginMsg").textContent="No se pudo iniciar sesión: "+error.message; else showApp();
});
$("logout").onclick=async()=>{await client.auth.signOut();location.reload()};

async function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");await render()}
async function render(){
  const {data,error}=await client.from("projects").select("*").order("created_at",{ascending:false});
  if(error){showMessage(error.message);return}
  $("list").innerHTML=(data||[]).map(p=>`
    <div class="item">
      <div class="thumb">${p.cover_url?`<img src="${p.cover_url}" alt="">`:"⚡"}</div>
      <div><b>${safe(p.title)}</b><br><small>${safe(p.service)} · ${safe(p.location||"")} · ${p.year||""}</small><br>
      <span class="status">${p.published?"PUBLICADO":"BORRADOR"}</span></div>
      <div class="actions">
        <button class="secondary" onclick="editProject('${p.id}')">Editar</button>
        <button class="danger" onclick="deleteProject('${p.id}')">Eliminar</button>
      </div>
    </div>`).join("") || '<div class="help">No hay proyectos todavía. Pulsa “Agregar proyecto”.</div>';
}

function newProject(){
  $("editor").classList.remove("hidden");$("form").reset();$("pid").value="";
  $("year").value="2026";$("published").checked=true;currentImages=[];currentVideo=null;
  renderPreview();$("videoPreview").textContent="";$("formTitle").textContent="Nuevo proyecto";
  $("editor").scrollIntoView({behavior:"smooth"});
}
async function editProject(id){
  const {data,error}=await client.from("projects").select("*").eq("id",id).single();
  if(error){showMessage(error.message);return}
  $("editor").classList.remove("hidden");$("pid").value=data.id;$("title").value=data.title;
  $("service").value=data.service;$("location").value=data.location||"";$("year").value=data.year||"";
  $("description").value=data.description||"";$("published").checked=!!data.published;
  currentImages=Array.isArray(data.images)?data.images:[];currentVideo=data.video_url||null;
  renderPreview();$("videoPreview").textContent=currentVideo?"Video actual: "+currentVideo:"";
  $("formTitle").textContent="Editar proyecto";$("editor").scrollIntoView({behavior:"smooth"});
}
function cancel(){$("editor").classList.add("hidden")}
function renderPreview(){
  $("preview").innerHTML=currentImages.map((url,i)=>`<div class="preview-item"><img src="${url}"><button class="remove" type="button" onclick="removeImage(${i})">×</button></div>`).join("");
}
function removeImage(i){currentImages.splice(i,1);renderPreview()}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9._-]+/g,"-").replace(/^-+|-+$/g,"")}

async function uploadFile(file,folder){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase();
  const path=`${folder}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
  const {error}=await client.storage.from("project-media").upload(path,file,{upsert:false,contentType:file.type});
  if(error) throw error;
  const {data}=client.storage.from("project-media").getPublicUrl(path);
  return data.publicUrl;
}
$("photoFiles").addEventListener("change",async e=>{
  const files=[...e.target.files]; if(!files.length)return;
  $("saveBtn").disabled=true;
  try{
    for(const file of files){
      if(file.size>15*1024*1024) throw new Error("Cada fotografía debe pesar menos de 15 MB.");
      currentImages.push(await uploadFile(file,"photos"));
    }
    renderPreview();
  }catch(err){showMessage("Error subiendo fotografía: "+err.message)}
  finally{$("saveBtn").disabled=false}
});
$("videoFile").addEventListener("change",async e=>{
  const file=e.target.files[0]; if(!file)return;
  if(file.size>100*1024*1024){showMessage("El video debe pesar menos de 100 MB.");return}
  $("saveBtn").disabled=true;
  try{
    currentVideo=await uploadFile(file,"videos");
    $("videoPreview").textContent="Video listo para publicar.";
  }catch(err){showMessage("Error subiendo video: "+err.message)}
  finally{$("saveBtn").disabled=false}
});

$("form").addEventListener("submit",async e=>{
  e.preventDefault(); $("saveBtn").disabled=true; showMessage("Guardando proyecto...");
  const obj={
    title:$("title").value.trim(),service:$("service").value,location:$("location").value.trim(),
    year:Number($("year").value)||null,description:$("description").value.trim(),
    cover_url:currentImages[0]||null,video_url:currentVideo,images:currentImages,published:$("published").checked
  };
  const id=$("pid").value;
  const result=id?await client.from("projects").update(obj).eq("id",id):await client.from("projects").insert(obj);
  if(result.error){showMessage("No se pudo guardar: "+result.error.message)}
  else{showMessage("Proyecto guardado correctamente.",true);cancel();await render()}
  $("saveBtn").disabled=false;
});
async function deleteProject(id){
  if(!confirm("¿Eliminar este proyecto de la página pública?"))return;
  const {error}=await client.from("projects").delete().eq("id",id);
  if(error)showMessage(error.message);else await render();
}
init();
</script>
</body>
</html>
